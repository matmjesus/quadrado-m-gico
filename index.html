<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Square Challenge | GitHub Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --kahoot-purple: #46178f;
            --kahoot-blue: #1368ce;
            --kahoot-green: #26890c;
            --kahoot-red: #e21b3c;
            --white: #ffffff;
            --bg-light: #f2f2f2;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--kahoot-purple);
            color: var(--white);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Cabeçalho Estilo Kahoot */
        .header {
            width: 100%;
            padding: 15px 0;
            text-align: center;
            background: rgba(0, 0, 0, 0.15);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        h1 {
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            font-size: 1.8rem;
            text-transform: uppercase;
        }

        /* Container Principal */
        .game-card {
            background: var(--white);
            border-radius: 20px;
            padding: 25px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            color: #333;
            text-align: center;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            color: var(--kahoot-purple);
        }

        .status-item {
            background: var(--bg-light);
            padding: 8px 12px;
            border-radius: 10px;
            border: 2px solid #ddd;
        }

        /* Grid do Quadrado */
        .grid {
            display: grid;
            gap: 12px;
            justify-content: center;
            background: #eee;
            padding: 15px;
            border-radius: 12px;
            margin: 0 auto;
        }

        .cell {
            width: 65px;
            height: 65px;
            font-size: 1.6rem;
            font-weight: 700;
            text-align: center;
            border: 3px solid #ccc;
            border-radius: 10px;
            outline: none;
            transition: all 0.2s ease;
        }

        /* Cores das Células */
        .cell.input {
            background: white;
            color: var(--kahoot-blue);
            border-color: #ddd;
        }

        .cell.input:focus {
            border-color: var(--kahoot-blue);
            transform: scale(1.05);
        }

        .cell.fixed {
            background: #f9f9f9;
            color: #888;
            border-color: #eee;
            cursor: not-allowed;
        }

        /* Botão Verificar */
        .btn-verify {
            margin-top: 25px;
            width: 100%;
            padding: 18px;
            font-size: 1.3rem;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            background-color: var(--kahoot-green);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 6px 0 #1a5e08;
            transition: all 0.1s;
        }

        .btn-verify:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #1a5e08;
        }

        /* Mensagens de Feedback */
        .message {
            margin-top: 15px;
            font-weight: 700;
            font-size: 1.1rem;
            height: 30px;
        }

        .success { color: var(--kahoot-green); }
        .error { color: var(--kahoot-red); }

        footer {
            margin-top: auto;
            padding: 20px;
            font-size: 0.8rem;
            opacity: 0.7;
        }

        /* Responsividade para telas pequenas */
        @media (max-width: 400px) {
            .cell { width: 50px; height: 50px; font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Fala Victor... Tá na área</h1>
    </div>

    <div class="game-card">
        <div class="status-bar">
            <div class="status-item" id="level-txt">Nível 1 (3x3)</div>
            <div class="status-item" id="sum-txt">Soma: 15</div>
        </div>

        <div id="magic-grid" class="grid">
            </div>

        <div id="feedback" class="message"></div>

        <button class="btn-verify" onclick="validateSquare()">VERIFICAR</button>
    </div>

    <footer>Matemática Recreativa | Inspirado no Kahoot</footer>

    <script>
        // Configurações dos Níveis
        const levels = [
            {
                size: 3,
                target: 15,
                data: [8, 1, 0, 3, 5, 7, 4, 0, 2] // 0 é campo vazio
            },
            {
                size: 4,
                target: 34,
                data: [16, 3, 2, 13, 5, 0, 10, 8, 9, 6, 0, 12, 4, 15, 14, 0]
            }
        ];

        let currentLevelIndex = 0;

        function loadLevel() {
            const level = levels[currentLevelIndex];
            const gridContainer = document.getElementById('magic-grid');
            const feedback = document.getElementById('feedback');
            
            // Atualiza UI
            document.getElementById('level-txt').innerText = `Nível ${currentLevelIndex + 1} (${level.size}x${level.size})`;
            document.getElementById('sum-txt').innerText = `Soma: ${level.target}`;
            feedback.innerText = "";
            
            // Limpa e configura Grid
            gridContainer.innerHTML = "";
            gridContainer.style.gridTemplateColumns = `repeat(${level.size}, 1fr)`;

            // Cria Células
            level.data.forEach((val) => {
                const input = document.createElement('input');
                input.type = 'number';
                input.className = 'cell';
                
                if (val !== 0) {
                    input.value = val;
                    input.readOnly = true;
                    input.classList.add('fixed');
                } else {
                    input.classList.add('input');
                }
                gridContainer.appendChild(input);
            });
        }

        function validateSquare() {
            const level = levels[currentLevelIndex];
            const cells = document.querySelectorAll('.cell');
            const values = Array.from(cells).map(c => parseInt(c.value) || 0);
            const feedback = document.getElementById('feedback');
            
            let win = true;

            // 1. Validar Linhas
            for (let i = 0; i < level.size; i++) {
                let rowSum = 0;
                for (let j = 0; j < level.size; j++) {
                    rowSum += values[i * level.size + j];
                }
                if (rowSum !== level.target) win = false;
            }

            // 2. Validar Colunas
            for (let i = 0; i < level.size; i++) {
                let colSum = 0;
                for (let j = 0; j < level.size; j++) {
                    colSum += values[j * level.size + i];
                }
                if (colSum !== level.target) win = false;
            }

            if (win) {
                feedback.innerHTML = "🎉 EXCELENTE! Você conseguiu!";
                feedback.className = "message success";
                
                // Avançar nível após 2 segundos
                setTimeout(() => {
                    if (currentLevelIndex < levels.length - 1) {
                        currentLevelIndex++;
                        loadLevel();
                    } else {
                        feedback.innerHTML = "🏆 VOCÊ VENCEU O DESAFIO FINAL!";
                    }
                }, 2000);
            } else {
