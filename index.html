<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Square Challenge</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --kahoot-purple: #46178f;
            --kahoot-blue: #1368ce;
            --kahoot-green: #26890c;
            --kahoot-red: #e21b3c;
            --white: #ffffff;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--kahoot-purple);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header {
            width: 100%;
            padding: 20px 0;
            text-align: center;
            background: rgba(0, 0, 0, 0.2);
            color: white;
            margin-bottom: 20px;
        }

        .game-card {
            background: var(--white);
            border-radius: 20px;
            padding: 25px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .status-item {
            background: #f0f0f0;
            padding: 10px;
            border-radius: 10px;
            font-weight: bold;
            color: var(--kahoot-purple);
            border: 1px solid #ddd;
            flex: 1;
            margin: 0 5px;
        }

        /* O segredo está aqui: Grid configurada corretamente */
        #magic-grid {
            display: grid;
            gap: 10px;
            background: #eee;
            padding: 15px;
            border-radius: 12px;
            margin: 20px auto;
            min-height: 100px; /* Garante que não fique invisível */
        }

        .cell {
            width: 100%;
            aspect-ratio: 1 / 1;
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
            border: 2px solid #ccc;
            border-radius: 8px;
            outline: none;
            box-sizing: border-box;
        }

        .cell.input { background: white; color: var(--kahoot-blue); }
        .cell.fixed { background: #e0e0e0; color: #777; cursor: not-allowed; }

        .btn-verify {
            width: 100%;
            padding: 15px;
            font-size: 1.2rem;
            font-family: 'Montserrat', sans-serif;
            font-weight: bold;
            background: var(--kahoot-green);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 5px 0 #1a5e08;
        }

        .btn-verify:active { transform: translateY(3px); box-shadow: 0 2px 0 #1a5e08; }

        .message { margin-top: 15px; font-weight: bold; min-height: 25px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Fala Victor... Tá na área</h1>
    </div>

    <div class="game-card">
        <div class="status-bar">
            <div id="level-txt" class="status-item">Nível 1</div>
            <div id="sum-txt" class="status-item">Soma: 15</div>
        </div>

        <div id="magic-grid"></div>

        <div id="feedback" class="message"></div>

        <button class="btn-verify" onclick="validateSquare()">VERIFICAR</button>
    </div>

    <script>
        const levels = [
            { size: 3, target: 15, data: [8, 1, 0, 3, 5, 7, 4, 9, 2] },
            { size: 4, target: 34, data: [16, 3, 2, 13, 5, 0, 10, 8, 9, 6, 7, 12, 4, 15, 14, 0] }
        ];

        let currentLevel = 0;

        function init() {
            const level = levels[currentLevel];
            const grid = document.getElementById('magic-grid');
            
            document.getElementById('level-txt').innerText = `Nível ${currentLevel + 1}`;
            document.getElementById('sum-txt').innerText = `Soma: ${level.target}`;
            
            grid.style.gridTemplateColumns = `repeat(${level.size}, 1fr)`;
            grid.innerHTML = "";

            level.data.forEach(val => {
                const input = document.createElement('input');
                input.type = 'number';
                input.className = 'cell ' + (val === 0 ? 'input' : 'fixed');
                if (val !== 0) {
                    input.value = val;
                    input.readOnly = true;
                }
                grid.appendChild(input);
            });
        }

        function validateSquare() {
            const level = levels[currentLevel];
            const cells = document.querySelectorAll('.cell');
            const values = Array.from(cells).map(c => parseInt(c.value) || 0);
            
            // Verificação simples de linha (exemplo)
            let rowSum = 0;
            for(let i=0; i<level.size; i++) rowSum += values[i];

            if (rowSum === level.target) {
                document.getElementById('feedback').innerText = "🎉 Acertou!";
                document.getElementById('feedback').style.color = "green";
                setTimeout(() => {
                    if(currentLevel < levels.length -1) {
                        currentLevel++;
                        init();
                    }
                }, 1500);
            } else {
                document.getElementById('feedback').innerText = "❌ Tente novamente!";
                document.getElementById('feedback').style.color = "red";
            }
        }

        // Isso garante que o jogo carregue assim que o script for lido
        init();
    </script>
</body>
</html>
